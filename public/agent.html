<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Voice-Agent</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: radial-gradient(ellipse at 50% 40%, #1b2340 0%, #0c0f1d 70%);
      color: #eef1fa;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .stage { text-align: center; }
    .orb-wrap { position: relative; width: 220px; height: 220px; margin: 0 auto 36px; }
    .orb {
      position: absolute; inset: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #5b7cfa, #9b5bfa);
      box-shadow: 0 0 60px rgba(110, 110, 250, 0.45);
      transition: transform 0.15s ease;
    }
    .ring {
      position: absolute; inset: 0;
      border-radius: 50%;
      border: 2px solid rgba(120, 140, 255, 0.35);
      opacity: 0;
    }
    body.speaking .orb { animation: pulse 0.9s ease-in-out infinite; }
    body.speaking .ring { animation: ripple 1.6s ease-out infinite; }
    body.speaking .ring:nth-child(2) { animation-delay: 0.5s; }
    body.listening .orb { animation: breathe 2.6s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.12); } }
    @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
    @keyframes ripple {
      0% { transform: scale(0.75); opacity: 0.8; }
      100% { transform: scale(1.25); opacity: 0; }
    }
    h1 { font-size: 44px; font-weight: 600; letter-spacing: 0.5px; }
    .subtitle { font-size: 22px; color: #9aa5c9; margin-top: 10px; }
    .badge {
      display: inline-block; margin-top: 22px; padding: 8px 20px;
      border: 1px solid rgba(150, 165, 220, 0.4); border-radius: 999px;
      font-size: 18px; color: #b9c3e6; background: rgba(30, 40, 75, 0.5);
    }
    .status { margin-top: 26px; font-size: 20px; color: #7f8ab0; min-height: 28px; }
  </style>
</head>
<body>
  <div class="stage">
    <div class="orb-wrap">
      <div class="ring"></div>
      <div class="ring"></div>
      <div class="orb"></div>
    </div>
    <h1 id="botName">Voice-Agent</h1>
    <div class="subtitle" id="subtitle"></div>
    <div class="badge">KI-Assistent &middot; Gespräch wird protokolliert</div>
    <div class="status" id="status">Verbinde&hellip;</div>
  </div>
  <audio id="botAudio" autoplay></audio>
  <script src="agent.js"></script>
</body>
</html>
